<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Размер окна</title>
<style>
  html, body { margin: 0; background: #101511; color: #f5f2ea; font: 20px/1.45 -apple-system, system-ui, sans-serif; }
  main { padding: 24px 20px; }
  h1 { margin: 0 0 16px; font-size: 24px; }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; }
  dt { color: rgba(245,242,234,.7); }
  dd { margin: 0; font-weight: 700; font-variant-numeric: tabular-nums; }
  .probe { position: fixed; left: 0; top: 0; width: 1px; visibility: hidden; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 8px; background: #f4b860; }
</style>
</head>
<body>
<div class="probe" id="svh" style="height:100svh"></div>
<div class="probe" id="dvh" style="height:100dvh"></div>
<div class="probe" id="lvh" style="height:100lvh"></div>
<div class="probe" id="sab" style="height:env(safe-area-inset-bottom,0px)"></div>
<main>
  <h1>Размер окна браузера</h1>
  <dl id="out"></dl>
  <p style="margin-top:20px;font-size:16px;color:rgba(245,242,234,.7)">Внизу экрана должна быть видна жёлтая полоска. Если её не видно, она спряталась под панелью браузера.</p>
</main>
<div id="bar"></div>
<script>
  var site = 'проверяю…';
  fetch('index.html?v=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) { site = t.indexOf('max-height: 620px') > -1 ? 'новая' : 'старая'; show(); }).catch(function () { site = 'не открылась'; show(); });
  function h(id) { return Math.round(document.getElementById(id).getBoundingClientRect().height); }
  function show() {
    var rows = [
      ['Окно, innerHeight', innerHeight],
      ['Видимая часть', window.visualViewport ? Math.round(visualViewport.height) : 'нет'],
      ['100svh', h('svh')], ['100dvh', h('dvh')], ['100lvh', h('lvh')],
      ['Отступ снизу (safe-area)', h('sab')],
      ['Ширина', innerWidth],
      ['Экран', screen.width + '×' + screen.height],
      ['Версия сайта на сервере', site]
    ];
    document.getElementById('out').innerHTML = rows.map(function (r) { return '<dt>' + r[0] + '</dt><dd>' + r[1] + '</dd>'; }).join('');
  }
  show();
  addEventListener('resize', show);
  if (window.visualViewport) visualViewport.addEventListener('resize', show);
</script>
</body>
</html>
